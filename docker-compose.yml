version: "3.9"

services:
  breach-hunter-server:
    container_name: breach-hunter-server
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      - breach-hunter-analysis-engine
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-openai/gpt-5.2}
      - SLM_ANALYSIS_ENGINE_URL=http://breach-hunter-analysis-engine:7000

  breach-hunter-agent:
    container_name: breach-hunter-agent
    build:
      context: .
      dockerfile: agent/Dockerfile
    depends_on:
      - breach-hunter-server
    environment:
      - BREACH_HUNTER_URL=http://breach-hunter-server:8000/notify
      - DEMO_AGENT_ID=demo-agent-001

  breach-hunter-client:
    container_name: breach-hunter-client
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      - breach-hunter-server
    ports:
      - "8080:80"

  breach-hunter-analysis-engine:
    container_name: breach-hunter-analysis-engine
    build:
      context: ./slm-analysis-engine
      dockerfile: Dockerfile
    ports:
      - "7001:7000"
    environment:
      - PORT=7000
      - HOST=0.0.0.0
      - BREACH_HUNTER_SLM_BACKEND=${BREACH_HUNTER_SLM_BACKEND:-auto}
      - BREACH_HUNTER_OLLAMA_MODEL=${BREACH_HUNTER_OLLAMA_MODEL:-llama3.2:1b}
      - BREACH_HUNTER_USE_SLM=${BREACH_HUNTER_USE_SLM:-1}
      - BREACH_HUNTER_USE_ML=${BREACH_HUNTER_USE_ML:-1}
      - BREACH_HUNTER_TRANSFORMERS_MODEL=${BREACH_HUNTER_TRANSFORMERS_MODEL:-distilbert-base-uncased}
